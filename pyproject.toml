[tool.black]
line-length = "110"
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.venv
    | venv
    | venv2
    | _build
    | build
    | dist
    | plugins
    | temp
  )/
)
'''

[tool.poetry]
name = 'Modmail'
version = '4.2.1'
description = "Modmail is similar to Reddit's Modmail, both in functionality and purpose. It serves as a shared inbox for server staff to communicate with their users in a seamless way."
license = 'AGPL-3.0-only'
authors = [
    'kyb3r <noemail@example.com>',
    '4jr <noemail@example.com>',
    'Taki <noemail@example.com>'
]
readme = 'README.md'
repository = 'https://github.com/modmail-dev/modmail'
homepage = 'https://github.com/modmail-dev/modmail'
keywords = ['discord', 'modmail']

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
emoji = "^2.15.0"
requests = "2.31.0"
flask = "^3.1.3"
waitress = ">=3.0.0"
motor = "3.7.1"
isodate = "^0.7.2"
cairosvg = "2.8.2"
lottie = {version = "0.7.2", extras = ["pdf"]}
uvloop = "^0.22.1"
pymongo = "^4.17.0"
colorama = "0.4.6"
packaging = "^26.1"
orjson = "3.11.4"
aiohttp = "^3.13.5"
natural = "0.2.0"
python-dateutil = "2.8.2"
pillow = "12.0.0"
discord-py = {version = "2.6.3", extras = ["speed"]}
python-dotenv = "1.0.0"
parsedatetime = "2.6"

[tool.pylint.format]
max-line-length = "110"
